<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,
  viewport-fit=cover">
<title>{% if ev %}{{ ev.name }} &mdash; live{% else %}Not live{% endif %}</title>
<meta name="theme-color" content="#0A1C1D">
<meta name="robots" content="noindex, nofollow">
<style>
/* The live leaderboard.
 *
 * Built for a screen in the room first and a phone second, which is the other
 * way round from most of this system.
 *
 * The shape of the page is the argument:
 *
 *   ON THE FLOOR   a full-width strip of cards along the top. It is the widest
 *                  thing here because it is the part that changes while
 *                  somebody is watching, and a room watching a race wants to
 *                  know who is out there before it wants a results table.
 *   THE FOUR       Elite Men, Elite Women, Open Men, Open Women - the ranked
 *                  finishers, side by side underneath.
 *
 * The strip is the one place all four are mixed. Splitting it would quarter
 * the cards and put the leader of one group above somebody further through
 * the race in another, so each card carries an E/O and an M/W instead.
 *
 * Nothing here leans on style.css: this page is opened by people who have
 * never seen the admin, and it has to stand up alone.
 */
*{box-sizing:border-box}
:root{
  --bg:#0A1C1D; --card:#0f2526; --line:#1b3a3a; --ink:#F2F5F7;
  --dim:#8fa6a6; --mint:#88EAE0; --mintdim:#5cc8bd; --amber:#e8c98f;
  --floor:#12211a; --floorline:#2c4632; --floorcard:#132a22;
}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
    "Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;
  padding:18px 18px 44px;
  min-height:100vh;
}
.wrap{max-width:1680px;margin:0 auto}

.head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
/* The mark is white on transparent, cut for the finisher card, and sits here
   at the size a header wants rather than the size a card wanted. */
.head .mark{flex:0 0 auto;width:64px;height:auto;display:block;opacity:.95}
.head h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.025em}
.head .sub{color:var(--dim);font-size:.78rem;margin-top:3px}
.live{
  margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  font-size:.7rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mint);background:#0d2f2d;border:1px solid #1c4a47;
  border-radius:999px;padding:7px 12px;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mint);
  animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.22}}
@media (prefers-reduced-motion:reduce){
  .dot,.seg.on{animation:none}
}

h2.band,h3.band{
  margin:0 0 10px;font-size:.76rem;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;color:var(--mintdim);
  display:flex;align-items:center;gap:9px;
}
h2.band .n,h3.band .n{color:var(--dim);font-weight:700;letter-spacing:.04em}
h2.band.hot{color:var(--amber)}

/* ---- on the floor ---- */
.floor{
  background:var(--floor);border:1px solid var(--floorline);
  border-radius:14px;padding:15px 16px;margin-bottom:16px;
}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cell{
  /* No margin: the grid's own gap spaces these, and a margin on top of it
     doubles the space between rows of cards. */
  background:var(--floorcard);border:1px solid var(--line);
  border-radius:11px;padding:11px 12px;min-width:0;
}
.cell .line{display:flex;align-items:center;gap:8px;min-width:0}
.cell .nm{
  font-weight:700;font-size:.98rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;
}
.sx{
  flex:0 0 auto;font-size:.6rem;font-weight:800;letter-spacing:.08em;
  color:var(--dim);border:1px solid var(--line);border-radius:4px;
  padding:3px 5px;line-height:1;white-space:nowrap;
}
/* The strip mixes all four groups, so a card has to say which one it is.
   Elite is coloured as well as lettered - on a screen across a room the
   colour lands before the letter does. */
.sx.elite{color:var(--mint);border-color:var(--mintdim)}
.cell .tm{margin-left:auto}
.cell .where{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  margin-top:7px;font-size:.74rem;color:var(--dim);
}
.cell .where .st{
  font-weight:800;color:var(--amber);letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cell .where .reps{font-variant-numeric:tabular-nums;flex:0 0 auto}

/* One segment per station, in race order. */
.trk{display:flex;gap:3px;margin-top:9px}
.seg{height:8px;flex:1;border-radius:2px;background:#20403e}
.seg.dn{background:var(--mintdim)}
.seg.on{background:var(--amber);animation:pulse 1.6s ease-in-out infinite}

.nofloor{
  color:var(--dim);font-size:.84rem;padding:6px 2px 14px;
}

/* ---- the ranked columns ---- */
/* Elite and Open are drawn as two boxes, two columns inside each, rather than
   four bare columns in a row. Four headings side by side made a reader work
   out for themselves that the first two belonged together; a box says it
   without being read.

   The boxes sit side by side on a wall screen and stack below about 1000px,
   which is where two columns inside a half-width box start to pinch. */
.groups{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.grp{
  flex:1 1 470px;min-width:0;
  border:1px solid var(--line);border-radius:15px;
  padding:14px 14px 8px;background:#0c2021;
}
/* The one difference between the two boxes, and it is deliberately small: a
   mint edge and a mint name. Elite is not more important than Open, it is
   just the one people scan for first. */
.grp.elite{border-color:#2c5f5a;background:#0d2725}
h2.gname{
  margin:0 0 12px;font-size:.95rem;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink);
  display:flex;align-items:baseline;gap:10px;
}
.grp.elite h2.gname{color:var(--mint)}
h2.gname .gn{
  font-size:.68rem;color:var(--dim);font-weight:700;letter-spacing:.06em;
}
.cols{display:flex;gap:11px;align-items:flex-start}
.col{flex:1 1 0;min-width:0}
/* The Unlisted column arrives as a bare .cols with no box round it, so it
   needs the basis the boxes get or it collapses to its content. */
.groups > .cols{flex:1 1 470px;min-width:0;padding-top:2px}
.row{
  display:flex;align-items:center;gap:11px;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:10px 12px;margin-bottom:6px;min-width:0;
}
.row.lead{border-color:var(--mintdim);background:#10322e}
.row.done{border-color:#1f5a52;background:#0e2b28}
.row.waiting{opacity:.55;border-style:dashed}
.row.out{opacity:.42}
.pl{
  flex:0 0 auto;width:24px;text-align:center;font-weight:800;font-size:.95rem;
  color:var(--mint);font-variant-numeric:tabular-nums;
}
.pl.none{color:var(--dim);font-weight:600;font-size:.74rem}
.fl{flex:0 0 auto;font-size:1.1rem;line-height:1}
.who{flex:1 1 auto;min-width:0}
.nm{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.st2{font-size:.7rem;color:var(--dim);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.tm{
  flex:0 0 auto;font-weight:800;font-size:1.05rem;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;text-align:right;
}
.tm.run{color:var(--amber)}
.tm.none{color:var(--dim);font-weight:600;font-size:.8rem}
.rule{
  height:1px;background:var(--line);margin:13px 2px 10px;
}

.empty{
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:18px 12px;text-align:center;color:var(--dim);font-size:.84rem;
}
/* The sponsors, along the bottom.
 *
 * Sized by a single scale on each mark's native width, the way the finisher
 * card does it, rather than by forcing them all to one height: these were cut
 * to sit together at their own proportions, and normalising the heights makes
 * the short wide ones enormous.
 *
 * Sitting directly on the background - no band, no box - and slightly dimmed,
 * so they read without competing with a race.
 */
.sponsors{
  /* Pinned to the bottom of the screen rather than to the bottom of the page.
     A field of thirty pushes a footer a long way down, and a sponsor mark that
     is only visible if somebody scrolls to it is a sponsor mark nobody sees.
     The board scrolls underneath; this does not move. */
  --sp:0.9;
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:12px 26px;padding:14px 16px;
  background:var(--bg);border-top:1px solid var(--line);
}
/* Dimmed on the marks themselves, never on the bar: opacity on the bar makes
   its own background see-through, and the board scrolls up behind it. */
.sponsors img{display:block;height:auto;opacity:.82}
/* The ten marks are 973px across at native size. The scale and the gap are
 * tuned per band so they sit on ONE line wherever the screen can hold one -
 * two lines of sponsors eat a fifth of a wall screen for no extra sponsor.
 * Below 900px they wrap, which is the right answer on a phone. */
@media (min-width:900px){  .sponsors{--sp:0.76;gap:12px 12px} }
@media (min-width:1200px){ .sponsors{--sp:0.98;gap:14px 18px;padding:16px 20px} }
@media (min-width:1500px){ .sponsors{--sp:1.15;gap:14px 28px} }
@media (max-width:559px){  .sponsors{--sp:0.6;gap:9px 16px;padding:10px 10px} }

/* ---- the room ---- */
@media (min-width:1200px){
  body{padding:26px 26px 56px}
  .head h1{font-size:2.1rem}
  .head .mark{width:86px}
  h2.band,h3.band{font-size:.9rem}
  h2.gname{font-size:1.15rem}
  .floor{padding:19px 20px;border-radius:16px}
  .cell{padding:14px 15px}
  .cell .nm{font-size:1.22rem}
  .cell .tm{font-size:1.35rem}
  .cell .where{font-size:.9rem;margin-top:9px}
  .seg{height:10px}
  .row{padding:13px 15px}
  .nm{font-size:1.15rem}
  .tm{font-size:1.4rem}
  .pl{width:32px;font-size:1.2rem}
  .fl{font-size:1.4rem}
}
@media (min-width:1700px){
  .cards{grid-template-columns:repeat(5,1fr)}
}

/* ---- a phone ---- */
@media (max-width:900px){
  .cards{grid-template-columns:repeat(2,1fr)}
}
/* Two columns inside a box need real width. Below this the box keeps its
   frame - which is the whole point of it - and stacks Men over Women. */
@media (max-width:660px){
  .cols{flex-direction:column;gap:0}
  .col + .col{margin-top:14px}
}
@media (max-width:559px){
  body{padding:12px 9px 34px}
  .cards{grid-template-columns:1fr}
  .floor{padding:12px 11px;border-radius:11px}
  .grp{padding:11px 10px 5px;border-radius:12px}
  h2.gname{font-size:.85rem;margin-bottom:10px}
  .cols{gap:7px}
  .row{padding:8px 8px;gap:7px;border-radius:9px}
  .pl{width:16px;font-size:.8rem}
  .fl{font-size:.92rem}
  /* Wrap rather than truncate: "Marco D." cut to "Marc..." is a row nobody
     can use. */
  .nm{font-size:.83rem;white-space:normal;overflow:visible;line-height:1.2}
  .st2{font-size:.64rem}
  .tm{font-size:.88rem}
  .head h1{font-size:1.15rem}
  .head .mark{width:44px}
}
</style>
</head>
<body>

{% if not ev %}
<div class="wrap">
  <div class="empty" style="margin-top:40px">
    <p style="margin:0 0 6px;font-weight:700;color:var(--ink)">This link is not
      live.</p>
    <p style="margin:0">Ask whoever sent it for the current one.</p>
  </div>
</div>
{% else %}
<div class="wrap">
  <div class="head">
    <img class="mark" src="/static/card/awaken.png" alt="AWAKEN">
    <div>
      <h1>{{ ev.name }}</h1>
      <div class="sub">Live standings</div>
    </div>
    <span class="live"><span class="dot"></span>Live</span>
  </div>

  <div class="floor">
    <h2 class="band hot">On the floor now <span class="n" id="nfloor">0</span></h2>
    <div class="cards" id="floor"></div>
    <div class="nofloor" id="nofloor" hidden>Nobody is racing this minute.</div>
  </div>

  <div class="groups" id="cols"></div>

  <div class="sponsors">
    {% for file, w in sponsors %}
    <img src="/static/card/sp/{{ file }}" alt=""
         style="width:calc(var(--sp) * {{ w }}px)">
    {% endfor %}
  </div>
</div>

<script>
/* Drawn once from what the server rendered, then re-asked every few seconds.
   The running clocks tick locally in between so a number moves at one second
   rather than jumping every five when a refresh lands. */
(function(){
  var FEED = {{ ('/l/' ~ ev.board_token ~ '/feed.json')|tojson }};
  var cols = {{ cols|tojson }};
  var syncAt = Date.now();
  var floorBox = document.getElementById('floor'),
      noFloor  = document.getElementById('nofloor'),
      nFloor   = document.getElementById('nfloor'),
      colsBox  = document.getElementById('cols');

  function mmss(s){
    s = Math.max(0, Math.floor(s));
    var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
    var two = function(n){ return (n<10?'0':'') + n; };
    return h ? (h + ':' + two(m) + ':' + two(ss)) : (m + ':' + two(ss));
  }
  function esc(t){
    return String(t == null ? '' : t)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
  function clock(r){
    if (r.time) { return '<div class="tm">' + esc(r.time) + '</div>'; }
    if (r.elapsed !== null && r.elapsed !== undefined) {
      return '<div class="tm run" data-el="' + r.elapsed + '">'
           + mmss(r.elapsed) + '</div>';
    }
    return '<div class="tm none">&mdash;</div>';
  }
  /* One segment per station: filled behind them, lit on the one they are on,
     dark ahead. The shape says how far without anybody reading a number. */
  function tracker(r){
    var out = '<div class="trk">';
    for (var i = 1; i <= (r.of || 0); i++) {
      var cls = i <= r.done ? 'seg dn' : (i === r.on ? 'seg on' : 'seg');
      out += '<i class="' + cls + '"></i>';
    }
    return out + '</div>';
  }

  function cardHTML(r){
    var where;
    if (r.st) {
      where = '<span class="st" title="' + esc(r.st_full) + '">'
            + esc(r.st) + '</span>'
            + '<span class="reps">' + esc(r.reps || '') + '</span>';
    } else {
      /* Their heat has gone off but no station is open yet - between two
         stations, or waiting for a coach to start counting. */
      where = '<span class="st">On the start line</span><span class="reps">'
            + (r.done ? r.done + ' / ' + r.of + ' done' : '') + '</span>';
    }
    return '<div class="cell"><div class="line">'
      + '<span class="fl">' + esc(r.flag) + '</span>'
      + '<span class="nm">' + esc(r.name) + '</span>'
      + '<span class="sx' + (r.elite ? ' elite' : '') + '">'
      + esc(r.sx) + '</span>'
      + clock(r)
      + '</div>' + tracker(r)
      + '<div class="where">' + where + '</div></div>';
  }

  function rowHTML(r){
    var cls = 'row';
    if (r.status === 'finished') { cls += r.place === 1 ? ' lead' : ' done'; }
    else if (r.out) { cls += ' out'; }
    else { cls += ' waiting'; }

    /* A place belongs to a finisher and to nobody else. */
    var pl = r.place
      ? '<div class="pl">' + r.place + '</div>'
      : '<div class="pl none">&middot;</div>';

    var sub = r.out ? r.label
            : (r.status === 'finished' ? (r.heat ? r.heat + ' heat' : 'Finished')
                                       : (r.heat ? r.heat + ' heat' : r.label));
    return '<div class="' + cls + '">' + pl
      + '<div class="fl">' + esc(r.flag) + '</div>'
      + '<div class="who"><div class="nm">' + esc(r.name) + '</div>'
      + '<div class="st2">' + esc(sub) + '</div></div>'
      + clock(r) + '</div>';
  }

  function render(){
    /* One pass over the data, splitting it the way the page is laid out:
       everybody racing into the strip, everybody else into their column. */
    var floor = [];
    cols.forEach(function(c){
      c.rows.forEach(function(r){ if (r.racing) { floor.push(r); } });
    });
    floor.sort(function(a, b){
      return (b.done - a.done) || ((b.on || 0) - (a.on || 0))
          || (b.elapsed - a.elapsed);
    });

    nFloor.textContent = floor.length;
    floorBox.innerHTML = floor.map(cardHTML).join('');
    floorBox.hidden = !floor.length;
    noFloor.hidden = !!floor.length;

    /* One column: the finishers, a rule, then everybody else. */
    function colHTML(c){
      var rest = c.rows.filter(function(r){ return !r.racing; });
      var fin = rest.filter(function(r){ return r.status === 'finished'; });
      var other = rest.filter(function(r){ return r.status !== 'finished'; });
      var body = rest.length
        ? fin.map(rowHTML).join('')
          + (fin.length && other.length ? '<div class="rule"></div>' : '')
          + other.map(rowHTML).join('')
        : '<div class="empty">Everybody is still out there.</div>';
      return '<div class="col"><h3 class="band">' + esc(c.short)
           + '<span class="n">' + fin.length + ' finished</span></h3>'
           + body + '</div>';
    }

    /* Elite and Open each get a box, in the order the server sent them.
       Built by walking the columns rather than from a fixed list of two, so
       a category with nobody in it never draws an empty frame - and a third
       one, if there is ever a third one, needs nothing here. */
    var groups = [], byCat = {};
    cols.forEach(function(c){
      var g = byCat[c.cat];
      if (!g) {
        g = byCat[c.cat] = {cat: c.cat, label: c.catLabel, cols: []};
        groups.push(g);
      }
      g.cols.push(c);
    });

    colsBox.innerHTML = groups.map(function(g){
      var fin = 0;
      g.cols.forEach(function(c){
        c.rows.forEach(function(r){
          if (r.status === 'finished') { fin++; }
        });
      });
      /* The Unlisted column has no category, so it gets no box and no name -
         a frame round it would make a gap in the data look like a division
         somebody could be entered in. */
      var inner = '<div class="cols">' + g.cols.map(colHTML).join('') + '</div>';
      if (!g.cat) { return inner; }
      return '<section class="grp' + (g.cat === 'elite' ? ' elite' : '') + '">'
           + '<h2 class="gname">' + esc(g.label)
           + '<span class="gn">' + fin + ' finished</span></h2>'
           + inner + '</section>';
    }).join('');
  }

  function tick(){
    var drift = (Date.now() - syncAt) / 1000;
    var els = document.querySelectorAll('.tm.run[data-el]');
    for (var i = 0; i < els.length; i++) {
      var base = parseFloat(els[i].getAttribute('data-el'));
      if (base >= 0) { els[i].textContent = mmss(base + drift); }
    }
  }

  function poll(){
    fetch(FEED, {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if (!j || !j.ok) { return; }
        cols = j.cols; syncAt = Date.now(); render();
      })
      .catch(function(){ /* a dropped phone signal is not an error state */ });
  }

  /* Keep the page clear of the pinned sponsor bar. Measured, not guessed:
     the bar wraps onto two or three lines on a narrow screen, and a guessed
     number hides the last row of the board on somebody's phone. */
  var bar = document.querySelector('.sponsors');
  function clear(){
    document.body.style.paddingBottom = (bar.offsetHeight + 18) + 'px';
  }

  render();
  clear();
  window.addEventListener('resize', clear);
  window.addEventListener('load', clear);
  setInterval(tick, 1000);
  setInterval(poll, 5000);
})();
</script>
{% endif %}

</body>
</html>
